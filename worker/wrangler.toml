name = "habits-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

# The API key is NOT here. Set it as a secret:
#   npx wrangler secret put ANTHROPIC_API_KEY
# Optional bot check (Cloudflare Turnstile):
#   npx wrangler secret put TURNSTILE_SECRET

[vars]
# Required. Comma-separated origins allowed to call the Worker. Empty = everything blocked.
ALLOWED_ORIGINS = "https://itayweiss01.github.io"
GITHUB_REPO = "ITAYweiss01/3DPrinter"
GITHUB_BASE = "main"
TODOIST_CLIENT_ID = ""

# Per-IP rate limit: 5 requests per 60 seconds.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Private storage for topic requests from visitors (not in the public repo).
# Create it once:  npx wrangler kv namespace create SUGGESTIONS
# then paste the id it prints here.
[[kv_namespaces]]
binding = "SUGGESTIONS"
id = "f7a0fe24cf684eeaa0f603f82198a0af"

# Topic approval opens a PR in this repo.
# Secrets (never in this file):
#   npx wrangler secret put ADMIN_TOKEN    # long random password for admin.html (24+ chars)
#   npx wrangler secret put GITHUB_TOKEN   # fine-grained token: this repo only, Contents + Pull requests: write

# Todoist connection (each visitor connects their own account).
# 1. Create an app at https://app.todoist.com/app/settings/integrations/app-management
#    OAuth redirect URL: https://<your-worker>.workers.dev/todoist/callback
# 2. Put the Client ID below (public), and the secrets with wrangler:
#      npx wrangler secret put TODOIST_CLIENT_SECRET
#      npx wrangler secret put TOKEN_KEY     # encrypts stored tokens: openssl rand -base64 32
# 3. npx wrangler kv namespace create TODOIST   and paste its id below.
[[kv_namespaces]]
binding = "TODOIST"
id = "0e21b69b847d40ab904abde674d3993a"
